[package]
name = "site-builder"
version = "0.2.0"
edition = "2021"
description = "Builds interplane.io from Rust source and facts read from the protocol repository"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
maud = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "site-builder"
path = "src/main.rs"
